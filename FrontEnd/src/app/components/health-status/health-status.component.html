<div class="health-badge"
     [ngClass]="state"
     (click)="checkHealth()"
     title="Click to refresh">

  <span class="dot"></span>

  <span class="label" *ngIf="state === 'checking'">
    Checking API...
  </span>

  <span class="label" *ngIf="state === 'healthy'">
    API v{{ version }}
  </span>

  <span class="label" *ngIf="state === 'unreachable'">
    API Unreachable
  </span>

</div>
